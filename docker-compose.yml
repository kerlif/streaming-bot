services:
  streaming-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: streaming-bot
    image: streaming-bot:hardened
    env_file:
      - .env
    environment:
      - DATABASE_PATH=/app/data/stream_manager.db
    # named volume (وليس ./data): Docker ينسخ ملكية /app/data من الصورة (botuser)
    # فلا يظهر الخطأ "unable to open database file". لتحويله لمجلد عادي نفّذ:
    #   mkdir data && sudo chown 1000:1000 data   ثم استبدل السطر بـ ./data:/app/data
    volumes:
      - bot-data:/app/data
    restart: unless-stopped
    init: true               # يمنع بقاء عمليات ffmpeg يتيمة (zombies)
    stop_grace_period: 20s   # وقت كافٍ لإيقاف ffmpeg بنظافة
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "/app/healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  bot-data:
